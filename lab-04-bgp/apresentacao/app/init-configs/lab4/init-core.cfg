! ===== AS100 =====
hostname AS100
ip domain-name lab4.local
username admin privilege 15 secret class
enable secret class
line vty 0 15
 login local
 transport input ssh
interface G0/0
 ip address 172.100.100.100 255.255.255.0
 no shutdown
interface G0/1
 ip address 192.168.2.1 255.255.255.252
 no shutdown
! ===== AS200 =====
hostname AS200
ip domain-name lab4.local
username admin privilege 15 secret class
enable secret class
line vty 0 15
 login local
 transport input ssh
interface G0/0
 ip address 172.200.200.100 255.255.255.0
 no shutdown
interface G0/1
 ip address 192.168.2.2 255.255.255.252
 no shutdown


 
! After applying, run these two lines manually at the prompt:
!   crypto key generate rsa modulus 1024
!   copy running-config startup-config
