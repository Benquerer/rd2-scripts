# Lab #05 (Desafio) - Grupo 1 - INIT / bootstrap configs
# Save as: init-configs/g1.cfg
#
# These are applied MANUALLY over the physical console (Fase 1), one
# block per router, BEFORE the web app can reach anything. They are NOT
# parsed by config_store.py - wrappers and auth are intentionally kept.
#
# Each block sets up SSH (admin/class, login local, enable secret class)
# and brings up ONLY the interfaces on the management / jump paths so the
# app can connect and tunnel. Loopbacks, LAN ports, OSPF/RIP/BGP all come
# later from default-configs/g1.cfg.
#
# Reach map (see inventory.py):
#   R1     172.100.100.11  direct (management subnet)
#   R2     10.1.1.2        via R1   (R1 G0/1)
#   R3     10.1.1.10       via R1   (R1 Serial0/1/0)
#   R4-RIP 10.1.1.50       via R1   (R1 Fa0/0/1)
#   AS100  172.17.1.2      via R1   (R1 G0/0)
#   AS200  172.21.1.2      via R1 -> R3 (R3 G0/0)

! ===== R1 =====
enable
configure terminal
hostname R1
no ip domain-lookup
ip domain-name lab.local
service password-encryption
username admin privilege 15 secret class
enable secret class
crypto key generate rsa modulus 2048
ip ssh version 2
line console 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
 exec-timeout 30 0
!
! === EDIT REQUIRED ===========================================
! The app reaches R1 at 172.100.100.11. Put that address on
! whatever physical port connects R1 to the 172.100.100.0/24
! access network and replace the interface name below.
interface GigabitEthernet0/2
 description -> management / access net (EDIT to real port)
 ip address 172.100.100.11 255.255.255.0
 no shutdown
! =============================================================
!
! jump-path interfaces (kept up so the app can tunnel out of R1)
interface GigabitEthernet0/1
 description -> R2 (jump path)
 ip address 10.1.1.1 255.255.255.252
 no shutdown
interface Serial0/1/0
 description -> R3 (jump path)
 ip address 10.1.1.9 255.255.255.252
 clock rate 128000
 no shutdown
interface FastEthernet0/0/1
 description -> R4-RIP (jump path)
 ip address 10.1.1.49 255.255.255.252
 no shutdown
interface GigabitEthernet0/0
 description -> AS100 (jump path)
 ip address 172.17.1.1 255.255.255.252
 no shutdown
end
copy running-config startup-config

