! ===== R1 =====
hostname R1
ip domain-name lab4.local
username admin privilege 15 secret class
enable secret class
line vty 0 15
 login local
 transport input ssh
interface GigabitEthernet0/0
 ip address 172.100.100.15 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 ip address 10.15.13.1 255.255.255.252
 no shutdown
